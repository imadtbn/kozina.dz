name: Site quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in javascript/*.js; do node --check "$file"; done
      - name: Validate site data and URLs
        run: npm run validate
